<div data-slate-part="toolbar" class="surface-toolbar slate-surface-toolbar">
  <div class="slate-toolbar-left">
    <h2 class="surface-title"><span class="surface-title-label">Slate</span></h2>
    <button data-slate-part="help" class="icon-btn cheatsheet-toggle-btn" type="button" title="Keyboard Shortcuts & Gestures Help (?)">
      <span class="btn-glyph">?</span>
    </button>
  </div>
  <div class="slate-toolbar-tools">
    <button data-slate-part="replay" class="icon-btn" type="button" title="Replay trace">
      <span class="btn-glyph">🐜</span>
      <span>Replay</span>
    </button>
  </div>
  <div data-slate-part="controls" class="surface-edit-controls">
    <span data-slate-part="status" class="slate-status"></span>
    <div id="edit-menu-dropdown" class="dropdown"></div>
    <div class="node-create-actions">
      <div id="create-menu-dropdown" class="dropdown"></div>
    </div>
  </div>
</div>
<div data-slate-part="canvas" id="slate-pane" class="slate-pane slate-surface surface-mono"></div>
