<div data-source-part="toolbar" class="surface-toolbar source-surface-toolbar hidden">
  <h2 class="surface-title"><span class="surface-title-label">Source</span></h2>
  <span id="caret-pos" class="surface-caret">x 0, y 0</span>
  <div class="source-actions">
    <button id="btn-overwrite" class="icon-btn toggle-btn active" type="button" aria-pressed="true" title="Overwrite Mode (Insert)">
      <span class="btn-glyph">⌖</span><span>OVR</span>
    </button>
  </div>
</div>
<section data-source-part="body" class="source-pane hidden" aria-label="Source">
  <div class="source-editor">
    <textarea id="source-input" class="surface-mono" spellcheck="false" wrap="off"></textarea>
  </div>
</section>
