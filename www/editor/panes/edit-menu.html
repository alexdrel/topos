<button id="btn-edit-menu" class="icon-btn dropdown-trigger-btn" type="button" title="Edit actions">
  <span>Edit</span> <span class="btn-glyph" style="font-size: 0.6rem; margin-left: 2px;">▼</span>
</button>
<div id="edit-menu-content" class="menu-content hidden">
  <button id="btn-undo" class="menu-item-btn" type="button" title="Undo (⌘Z)" disabled>
    <span class="menu-item-title">
      <span class="btn-glyph">↶</span>
      <span>Undo</span>
    </span>
    <kbd class="menu-key">⌘Z</kbd>
  </button>
  <button id="btn-redo" class="menu-item-btn" type="button" title="Redo (⌘Y)" disabled>
    <span class="menu-item-title">
      <span class="btn-glyph">↷</span>
      <span>Redo</span>
    </span>
    <kbd class="menu-key">⌘Y</kbd>
  </button>

  <div class="menu-separator"></div>

  <button id="btn-cut" class="menu-item-btn trace-clipboard-btn" type="button" title="Cut Selected (⌘X)" disabled>
    <span class="menu-item-title">
      <span class="btn-glyph">✀</span>
      <span>Cut</span>
    </span>
    <kbd class="menu-key">⌘X</kbd>
  </button>
  <button id="btn-copy" class="menu-item-btn trace-clipboard-btn" type="button" title="Copy Selected (⌘C)" disabled>
    <span class="menu-item-title">
      <span class="btn-glyph">⧉</span>
      <span>Copy</span>
    </span>
    <kbd class="menu-key">⌘C</kbd>
  </button>
  <button id="btn-paste" class="menu-item-btn trace-clipboard-btn" type="button" title="Paste (⌘V)">
    <span class="menu-item-title">
      <span class="btn-glyph">↧</span>
      <span>Paste</span>
    </span>
    <kbd class="menu-key">⌘V</kbd>
  </button>
  <button id="btn-duplicate-right" class="menu-item-btn trace-clipboard-btn" type="button" title="Duplicate Right (⌘D)">
    <span class="menu-item-title">
      <span class="btn-glyph">→</span>
      <span>Duplicate Right</span>
    </span>
    <kbd class="menu-key">⌘D</kbd>
  </button>
  <button id="btn-duplicate-down" class="menu-item-btn trace-clipboard-btn" type="button" title="Duplicate Down (⇧⌘D)">
    <span class="menu-item-title">
      <span class="btn-glyph">↓</span>
      <span>Duplicate Down</span>
    </span>
    <kbd class="menu-key">⇧⌘D</kbd>
  </button>

  <div class="menu-separator"></div>

  <button id="btn-delete" class="menu-item-btn danger-btn" type="button" title="Delete Selected (Delete)">
    <span class="menu-item-title">
      <span class="btn-glyph">✕</span>
      <span>Delete</span>
    </span>
    <kbd class="menu-key">Del</kbd>
  </button>
</div>
