<div class="pane-head">
  <div id="btn-legend-toggle" class="pane-head-toggle" aria-expanded="true">
    <span>Legend</span>
  </div>
  <span id="legend-chevron" class="pane-chevron">▾</span>
</div>
<div id="legend-pane" class="pane-body">
  <textarea
    id="legend-input"
    class="surface-mono"
    spellcheck="false"
    wrap="off"
    placeholder=":legend theme=dark ink=yellow&#10;[Label] : #id@type .class&#10;[A] ~> [B] : .dashed"
  >:legend
[/]: sketch
[*] -> [*] : rounded</textarea>
</div>
