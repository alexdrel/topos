<div data-enamel-part="toolbar">
  <div class="pane-head-toggle side-only" aria-expanded="true"><span>Preview</span></div>
  <h2 class="surface-title main-only"><span class="surface-title-label">SVG View</span></h2>
  <div data-enamel-part="controls">
    <button class="icon-btn enamel-zoom-btn btn-zoom-out" type="button" title="Zoom Out">−</button>
    <button class="icon-btn enamel-zoom-btn btn-zoom-reset" type="button" title="Reset Zoom">100%</button>
    <button class="icon-btn enamel-zoom-btn btn-zoom-in" type="button" title="Zoom In">+</button>
    <button class="icon-btn enamel-paper-btn btn-paper" type="button" title="Preview background">White</button>
    <button class="icon-btn toggle-btn enamel-override-btn btn-override" type="button" title="Override diagram appearance">!</button>
    <span class="control-separator main-only">|</span>
    <div id="export-menu-dropdown" class="dropdown main-only"></div>
  </div>
  <span class="pane-chevron side-only">▾</span>
</div>
<div data-enamel-part="pane" class="enamel-pane"></div>
