<button id="btn-export-menu" class="icon-btn dropdown-trigger-btn" type="button" title="Export options">
  <span>Export</span> <span class="btn-glyph" style="font-size: 0.6rem; margin-left: 2px;">▼</span>
</button>
<div id="export-menu-content" class="menu-content hidden">
  <label class="control-checkbox-label" title="Export with a transparent background">
    <input type="checkbox" id="chk-svg-transparent" class="chk-transparent" />
    <span>Transparent</span>
  </label>

  <div class="menu-separator"></div>

  <button id="btn-svg-copy-png" class="menu-item-btn btn-copy-png" type="button" title="Copy PNG to clipboard (⌘C)">
    <span class="menu-item-title">
      <span class="btn-glyph">📷</span>
      <span>Copy Image</span>
    </span>
    <kbd class="menu-key">⌘C</kbd>
  </button>
  <button id="btn-svg-download-png" class="menu-item-btn btn-download-png" type="button" title="Download PNG file">
    <span class="menu-item-title">
      <span class="btn-glyph">⬇</span>
      <span>Save PNG</span>
    </span>
  </button>
  <button id="btn-svg-open-png" class="menu-item-btn btn-open-png" type="button" title="Open PNG in New Tab">
    <span class="menu-item-title">
      <span class="btn-glyph">↗</span>
      <span>Open Image in New Tab</span>
    </span>
  </button>

  <div class="menu-separator"></div>

  <button id="btn-svg-copy-xml" class="menu-item-btn btn-copy-xml" type="button" title="Copy SVG XML to clipboard (⇧⌘C)">
    <span class="menu-item-title">
      <span class="btn-glyph">📋</span>
      <span>Copy SVG</span>
    </span>
    <kbd class="menu-key">⇧⌘C</kbd>
  </button>
  <button id="btn-svg-download-xml" class="menu-item-btn btn-download-xml" type="button" title="Download SVG file">
    <span class="menu-item-title">
      <span class="btn-glyph">⬇</span>
      <span>Save SVG</span>
    </span>
  </button>
  <button id="btn-svg-open-xml" class="menu-item-btn btn-open-xml" type="button" title="Open SVG in New Tab">
    <span class="menu-item-title">
      <span class="btn-glyph">↗</span>
      <span>Open SVG in New Tab</span>
    </span>
  </button>
</div>
