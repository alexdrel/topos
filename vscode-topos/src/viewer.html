<!-- deno-fmt-ignore-file -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topos Viewer</title>
  <style>
    :root {
      color-scheme: light dark;
      --tp-viewer-bg: var(--vscode-editor-background, #1e1e1e);
      --tp-viewer-fg: var(--vscode-editor-foreground, #d4d4d4);
      --tp-viewer-error: var(--vscode-errorForeground, #f48771);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--tp-viewer-bg);
      color: var(--tp-viewer-fg);
      font-family: var(--vscode-font-family, system-ui, sans-serif);
    }

    #viewer-scroll {
      width: 100%;
      height: 100%;
      overflow: auto;
      outline: none;
    }

    .stage {
      min-width: 100%;
      min-height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      box-sizing: border-box;
      padding: 12px;
    }

    .stage > svg {
      flex: 0 0 auto;
      max-width: none;
      height: auto;
    }

    .error {
      box-sizing: border-box;
      width: min(900px, 100%);
      padding: 24px;
    }

    .error h1 {
      margin: 0 0 12px;
      color: var(--tp-viewer-error);
      font-size: 18px;
      font-weight: 600;
    }

    .error pre {
      margin: 0;
      padding: 12px;
      overflow: auto;
      border: 1px solid color-mix(in srgb, var(--tp-viewer-error) 45%, transparent);
      background: color-mix(in srgb, var(--tp-viewer-error) 10%, transparent);
      color: var(--tp-viewer-fg);
      white-space: pre-wrap;
      font-family: var(--vscode-editor-font-family, ui-monospace, monospace);
      font-size: var(--vscode-editor-font-size, 13px);
    }
  </style>
</head>
<body>
  <div id="viewer-scroll" tabindex="-1"></div>
  <script>
    const vscode = acquireVsCodeApi();
    const MIN_ZOOM = 0.1;
    const MAX_ZOOM = 4;
    const SCROLLBAR_SIZE = 14;
    const KEY_ZOOM_STEP = 1.25;
    const ZOOM_EPSILON = 0.0001;
    const SNAP_EPSILON = 0.6;
    const ANCHOR_MAGNET = 0.06;
    const ZOOM_ANCHORS = [50, 100, 150, 200];
    const scrollEl = document.getElementById("viewer-scroll");
    let zoom = 1;
    let fitMode = null;
    let sessionUpdateTimer;

    function reportSessionState() {
      clearTimeout(sessionUpdateTimer);
      sessionUpdateTimer = undefined;
      const state = { zoom, fitMode, scrollLeft: scrollEl.scrollLeft, scrollTop: scrollEl.scrollTop };
      vscode.postMessage({
        type: "sessionStateUpdate",
        state,
      });
    }

    function scheduleSessionStateUpdate() {
      clearTimeout(sessionUpdateTimer);
      sessionUpdateTimer = setTimeout(reportSessionState, 120);
    }

    function restoreScroll(scrollLeft, scrollTop) {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          scrollEl.scrollTo(scrollLeft, scrollTop);
        });
      });
    }

    function svgSize() {
      const svg = document.querySelector(".stage > svg");
      if (!svg) return null;
      const viewBox = svg.viewBox.baseVal;
      const width = Number.parseFloat(svg.getAttribute("width")) || viewBox.width;
      const height = Number.parseFloat(svg.getAttribute("height")) || viewBox.height;
      return { svg, width, height };
    }

    function clampZoom(value) {
      if (!Number.isFinite(value)) return zoom;
      return Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, value));
    }

    function fitZoom(mode) {
      const size = svgSize();
      if (!size) return 1;
      const width = globalThis.innerWidth - 24;
      const height = globalThis.innerHeight - 24;
      if (mode === "width") return (width - SCROLLBAR_SIZE) / size.width;
      if (mode === "height") return (height - SCROLLBAR_SIZE) / size.height;
      return Math.min(width / size.width, height / size.height);
    }

    function reportStatus(size) {
      if (!size) return;
      let reportedFit = fitMode;
      if (fitMode && fitMode !== "all" && Math.abs(fitZoom(fitMode) - fitZoom("all")) <= ZOOM_EPSILON) {
        reportedFit = "all";
      }
      const mode = reportedFit === "all" ? "Fit " : reportedFit === "width" ? "Fit W " : reportedFit === "height" ? "Fit H " : "";
      vscode.postMessage({
        type: "status",
        text: `${mode}${Math.round(zoom * 100)}% · ${Math.round(size.width)} × ${Math.round(size.height)} px`,
        tooltip: "Toggle 100% / Fit All\n\nTopos viewer zoom and intrinsic SVG dimensions",
        command: "topos.viewer.toggleFit",
      });
    }

    function applyZoom() {
      const size = svgSize();
      if (!size) return;
      if (fitMode) zoom = clampZoom(fitZoom(fitMode));
      size.svg.style.zoom = zoom;
      reportStatus(size);
    }

    function setZoom(next, clientX, clientY, nextFitMode = null) {
      next = clampZoom(next);
      if (Math.abs(next - zoom) <= ZOOM_EPSILON && fitMode === nextFitMode) return;
      const ratio = next / zoom;
      const contentX = scrollEl.scrollLeft + clientX;
      const contentY = scrollEl.scrollTop + clientY;
      fitMode = nextFitMode;
      zoom = next;
      applyZoom();
      scrollEl.scrollTo(contentX * ratio - clientX, contentY * ratio - clientY);
      scheduleSessionStateUpdate();
    }

    globalThis.addEventListener("wheel", (event) => {
      if (!event.metaKey && !event.ctrlKey) return;
      event.preventDefault();
      scrollEl.focus({ preventScroll: true });
      setZoom(zoom * Math.exp(-event.deltaY * 0.002), event.clientX, event.clientY);
    }, { passive: false });

    function stepZoom(direction) {
      const currentPercent = zoom * 100;
      const targetPercent = direction > 0 ? currentPercent * KEY_ZOOM_STEP : currentPercent / KEY_ZOOM_STEP;
      const anchor = direction > 0
        ? ZOOM_ANCHORS.find((value) => value > currentPercent + SNAP_EPSILON)
        : ZOOM_ANCHORS.findLast((value) => value < currentPercent - SNAP_EPSILON);
      if (anchor !== undefined) {
        const magnetic = direction > 0
          ? targetPercent >= anchor * (1 - ANCHOR_MAGNET)
          : targetPercent <= anchor * (1 + ANCHOR_MAGNET);
        if (magnetic) return anchor / 100;
      }
      return targetPercent / 100;
    }

    function setFit(mode, clientX, clientY) {
      setZoom(fitZoom(mode), clientX, clientY, mode);
    }

    function toggleFit(clientX, clientY) {
      if (Math.abs(zoom - 1) > ZOOM_EPSILON || fitMode) setZoom(1, clientX, clientY);
      else setFit("all", clientX, clientY);
    }

    globalThis.addEventListener("mousedown", (event) => {
      if (event.detail !== 2) return;
      if (event.target instanceof Element && event.target.closest("text")) return;
      event.preventDefault();
    }, true);

    globalThis.addEventListener("dblclick", (event) => {
      if (event.target instanceof Element && event.target.closest("text")) return;
      event.preventDefault();
      toggleFit(event.clientX, event.clientY);
    });

    globalThis.addEventListener("keydown", (event) => {
      if (!event.metaKey && !event.ctrlKey && !event.altKey && !event.shiftKey) {
        if (event.code === "Digit0") {
          event.preventDefault();
          toggleFit(globalThis.innerWidth / 2, globalThis.innerHeight / 2);
          return;
        }
        const action = { KeyT: "cycleTheme", KeyF: "toggleForce", KeyE: "export" }[event.code];
        if (action) {
          event.preventDefault();
          vscode.postMessage({ type: "action", action });
          return;
        }
      }
      let next;
      if (event.key === "+" || event.key === "=") next = stepZoom(1);
      else if (event.key === "-") next = stepZoom(-1);
      else if (event.key === "1" || event.key === "2") {
        event.preventDefault();
        const mode = event.key === "1" ? "width" : "height";
        setFit(mode, globalThis.innerWidth / 2, globalThis.innerHeight / 2);
        return;
      }
      else return;
      event.preventDefault();
      setZoom(next, globalThis.innerWidth / 2, globalThis.innerHeight / 2);
    });

    globalThis.addEventListener("resize", () => fitMode && applyZoom());
    scrollEl.addEventListener("scrollend", reportSessionState);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) reportSessionState();
    });

    globalThis.addEventListener("message", (event) => {
      if (event.data?.type === "sessionState") {
        const state = event.data.state;
        zoom = state.zoom ?? zoom;
        fitMode = state.fitMode ?? null;
        applyZoom();
        restoreScroll(state.scrollLeft ?? 0, state.scrollTop ?? 0);
        return;
      }
      if (event.data?.type === "toggleFit") {
        toggleFit(globalThis.innerWidth / 2, globalThis.innerHeight / 2);
        return;
      }
      if (event.data?.type !== "update") return;
      const scrollLeft = scrollEl.scrollLeft;
      const scrollTop = scrollEl.scrollTop;
      scrollEl.innerHTML = event.data.content;
      applyZoom();
      restoreScroll(scrollLeft, scrollTop);
    });

    applyZoom();
    vscode.postMessage({ type: "ready" });
  </script>
</body>
</html>
