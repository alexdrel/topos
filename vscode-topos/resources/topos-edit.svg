<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128">
  <!-- Box from Topos brand layout -->
  <rect x="3" y="10" width="12" height="12" rx="2.5" fill="none" stroke="#c97020" stroke-width="2.2"/>
  <!-- Custom stroke-based pencil glyph, rotated to point bottom-left (towards the box) -->
  <g transform="translate(24, 8) rotate(45)" fill="none" stroke="#c97020" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body and tip -->
    <path d="M -2,-3 L -2,3.2 L 0,5.7 L 2,3.2 L 2,-3 Z"/>
    <!-- Eraser cap -->
    <path d="M -2,-3 L -2,-4.8 C -2,-5.8 2,-5.8 2,-4.8 L 2,-3"/>
    <!-- Lead tip line -->
    <path d="M -0.8,4.7 L 0.8,4.7"/>
    <!-- Eraser collar band -->
    <path d="M -2,-2 L 2,-2"/>
  </g>
</svg>
