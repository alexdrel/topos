name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Type check, lint, and test
        run: npm test
      - name: Check formatting
        run: npm run fmt:check
      - name: Build extension and CLI
        run: npm run build
      - name: Validate VSIX packaging
        run: npm run ext:package
      - name: Check that validation leaves the checkout unchanged
        run: |
          git add .
          git diff --staged --exit-code --stat
