name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Verify shared release version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifests = ['package.json', 'vscode-topos/package.json', 'package-topos/package.json'];
          for (const path of manifests) {
            const { version } = JSON.parse(readFileSync(path, 'utf8'));
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error(`${path}: version ${version} does not match ${process.env.GITHUB_REF_NAME}`);
            }
          }
          NODE
      - run: npm test
      - run: npm run fmt:check
      - run: npm run build
      - run: npm run ext:package
      - name: Pack npm release
        working-directory: package-topos
        run: npm pack --pack-destination ../tmp
      - name: Check that validation leaves the checkout unchanged
        run: |
          git add .
          git diff --staged --exit-code --stat
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" tmp/topos.vsix --draft --verify-tag --generate-notes
      - name: Publish npm package
        working-directory: package-topos
        run: npm publish ../tmp/alexdrel-topos-*.tgz --access public
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
